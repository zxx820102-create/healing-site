name: 给一个建议
description: 关于周报、直播或网站，哪里可以更好？
title: "建议："
labels: ["建议"]
body:
  - type: markdown
    attributes:
      value: |
        谢谢你愿意写给我们。每一条我们都会读，能做的会陆续去做；做到了会在周报里告诉大家。
        想在周报里引用你的原话时，我们会先在这里问你"可以吗"，你说可以才引用。
        请不要写手机号、住址、身份证号这类私人信息——这里的内容所有人都看得见。
  - type: textarea
    id: words
    attributes:
      label: 你的建议
      placeholder: 比如：字可以再大一点
    validations:
      required: true
  - type: dropdown
    id: quote
    attributes:
      label: 以后可以在周报里匿名引用这句话吗？
      options:
        - 先问我
        - 可以，匿名引用
        - 不要引用
    validations:
      required: true
